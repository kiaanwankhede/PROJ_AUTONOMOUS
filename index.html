<!doctype html>

<title>Autonomous Enterprise Playbook</title>
<style>
:root{--bg:#f3f6f7;--ink:#132027;--ink2:#43525c;--accent:#00707a}

body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

p.k{font:500 .75rem/1.4 ui-monospace,Menlo,Consolas,monospace;letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin:0 0 .6rem}

<body>
<main>
<p class="k">Research briefing &amp; team plan</p>
